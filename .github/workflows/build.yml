name: Build ExternalHUD IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate project invariants
        run: python3 Scripts/validate_project.py
      - name: Cache Theos and SDKs
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-sdk-master-v1
      - name: Set up Theos
        uses: Randomblock1/theos-action@v1.5
      - name: Build and stage iOS app
        run: make stage FINALPACKAGE=1
      - name: Locate staged app
        id: app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=".theos/_/Applications/ExternalHUD.app"
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Theos did not stage ExternalHUD.app with an Info.plist."
            find .theos/_ -maxdepth 7 -print || true
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
      - name: Package and verify IPA
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          ditto "$APP_PATH" dist/Payload/ExternalHUD.app
          plutil -lint dist/Payload/ExternalHUD.app/Info.plist
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Payload/ExternalHUD.app/Info.plist)
          test "$BUNDLE_ID" = "com.gira983.externalhud"
          cd dist
          /usr/bin/zip -qry ExternalHUD.ipa Payload
          /usr/bin/unzip -t ExternalHUD.ipa
          test -s ExternalHUD.ipa
          echo "IPA verified: $(pwd)/ExternalHUD.ipa"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ExternalHUD-IPA-${{ github.sha }}
          path: dist/ExternalHUD.ipa
          if-no-files-found: error
          retention-days: 14
