name: ExternalHUD IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: externalhud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout Dopamine 3.x and project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Procursus tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install GNU Make
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos and iOS SDK
        run: |
          set -eux
          export BASEDIR="$PWD"
          export THEOS="$BASEDIR/theos"
          mkdir -p "$THEOS"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos >> install-theos.sh
          gsed -E '/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p ${THEOS}\/sdks\n\1touch ${THEOS}\/sdks\/sdk\n\1\2/g' -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          gunzip "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "$THEOS/sdks/iPhoneOS16.5.sdk.tar" -C "$THEOS/sdks"
          rm "$THEOS/sdks/iPhoneOS16.5.sdk.tar"

      - name: Build trustcache utility
        run: |
          set -eux
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Install libarchive
        run: brew install libarchive

      - name: Download Dopamine bootstrap assets
        run: |
          cd Dopamine/Application/Dopamine/Resources
          ./download_bootstraps.sh

      - name: Apply ExternalHUD process manager
        run: python3 Scripts/apply_externalhud.py

      - name: Build IPA
        run: |
          export THEOS="$PWD/theos"
          gmake -C Dopamine -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=1
          cp Dopamine/Application/Dopamine.ipa ExternalHUD.ipa
          test -s ExternalHUD.ipa
          unzip -t ExternalHUD.ipa

      - name: Upload ExternalHUD IPA
        uses: actions/upload-artifact@v4
        with:
          name: ExternalHUD-IPA-${{ github.sha }}
          path: ExternalHUD.ipa
          if-no-files-found: error
